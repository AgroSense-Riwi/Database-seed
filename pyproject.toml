[project]
name = "agrosense-bd-seed"
version = "0.1.0"
description = "AgroSense Café — Reproducible and Idempotent Data Seed for PostgreSQL"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"seed/**" = ["S311"]    # PRNG estándar para simulación determinista

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=seed --cov-report=term-missing"
